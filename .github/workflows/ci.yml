name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: creditpulse
          POSTGRES_PASSWORD: creditpulse
          POSTGRES_DB: creditpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creditpulse -d creditpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: creditpulse
      POSTGRES_PASSWORD: creditpulse
      POSTGRES_DB: creditpulse
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
