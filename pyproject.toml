[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creditpulse"
version = "0.1.0"
description = "Local-first synthetic credit portfolio data platform."
requires-python = ">=3.11"
dependencies = [
  "dbt-core==1.8.8",
  "dbt-postgres==1.8.2",
  "psycopg[binary]==3.2.3",
  "pyarrow==17.0.0",
  "pyspark==3.5.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
]

[project.scripts]
creditpulse = "creditpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs PostgreSQL and a JVM",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
